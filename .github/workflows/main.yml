name: Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved trading state
        uses: actions/cache/restore@v4
        with:
          path: |
            paper_state.json
            trades.csv
          key: paper-state-${{ github.run_id }}
          restore-keys: |
            paper-state-

      - name: Run paper trading bot
        run: python bot.py

      - name: Save trading history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json trades.csv
          git diff --cached --quiet || git commit -m "Update paper trading history"
          git push
